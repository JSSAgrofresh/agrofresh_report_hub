<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fondo cuadrado redondeado verde oscuro -->
  <rect width="32" height="32" rx="7" fill="#2a4a1c"/>
  <!-- Barras con colores AgroFresh -->
  <!-- barra 1: corta, verde medio -->
  <rect x="3"  y="18" width="5" height="11" rx="1.5" fill="#5a9430"/>
  <!-- barra 2: mediana, verde brillante (primario) -->
  <rect x="10" y="12" width="5" height="17" rx="1.5" fill="#6dad3c"/>
  <!-- barra 3: alta, verde claro -->
  <rect x="17" y="7"  width="5" height="22" rx="1.5" fill="#8dc85a"/>
  <!-- barra 4: mediana, amarillo acento -->
  <rect x="24" y="14" width="5" height="15" rx="1.5" fill="#e8c32e"/>
</svg>
